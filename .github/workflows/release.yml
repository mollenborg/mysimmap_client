name: Release

# Runs when you push a tag like v1.0.0 (or manually from the Actions tab for a test build)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            name: windows-x64
          - rid: linux-x64
            name: linux-x64
          - rid: osx-arm64
            name: macos-arm64
          - rid: osx-x64
            name: macos-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: ver
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: >
          dotnet publish mysimmap_client/mysimmap_client.csproj
          -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o out

      - name: Package
        run: |
          cd out
          rm -f *.pdb
          zip -r ../mysimmap_client-${{ steps.ver.outputs.version }}-${{ matrix.name }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: mysimmap_client-*.zip

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
